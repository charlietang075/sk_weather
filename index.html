<script>
    const now = new Date();
    document.getElementById('current-date').innerText = now.toLocaleDateString('zh-HK', { month: '2-digit', day: '2-digit', year: 'numeric' });

    async function fetchWeatherData() {
      try {
        const weatherRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const weatherData = await weatherRes.json();
        
        document.getElementById('update-time').innerText = weatherData.updateTime.substring(11, 16);
        
        if (weatherData.icon && weatherData.icon.length > 0) {
          const iconId = weatherData.icon[0];
          const iconImg = document.getElementById('weather-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
          iconImg.style.display = 'block'; 
        }

        const skTemp = weatherData.temperature.data.find(d => d.place === '西貢');
        if (skTemp) document.getElementById('temp-display').innerText = `${skTemp.value}°C`;
        
        if (weatherData.humidity && weatherData.humidity.data[0]) {
          document.getElementById('humidity-display').innerText = `${weatherData.humidity.data[0].value}%`;
        }

        if (weatherData.rainfall && weatherData.rainfall.data) {
          const skRain = weatherData.rainfall.data.find(d => d.place === '西貢');
          if (skRain) {
            document.getElementById('rainfall-display').innerText = `${skRain.max} mm`;
          } else {
            document.getElementById('rainfall-display').innerText = `0 mm`;
          }
        }

        if (weatherData.uvindex && weatherData.uvindex.data && weatherData.uvindex.data.length > 0) {
          const uv = weatherData.uvindex.data[0];
          document.getElementById('uv-display').innerText = `${uv.value} (${uv.desc})`;
        } else {
          document.getElementById('uv-display').innerText = `暫無數據`; 
        }

        try {
          const fndRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
          const fndData = await fndRes.json();
          if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
            const todayForecast = fndData.weatherForecast[0];
            const uvKey = Object.keys(todayForecast).find(key => key.toLowerCase().includes('uv'));
            
            if (uvKey && todayForecast[uvKey]) {
              const maxUvData = todayForecast[uvKey];
              const maxUvValue = typeof maxUvData === 'object' ? maxUvData.value : maxUvData;
              document.getElementById('uv-max-display').innerText = maxUvValue;
            } else {
              document.getElementById('uv-max-display').innerText = `暫無數據`;
            }
          }
        } catch (e) {
          console.error("Error fetching fnd API", e);
        }

        const warningsRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const warningsData = await warningsRes.json();
        const warningsDiv = document.getElementById('warnings-display');
        
        if (Object.keys(warningsData).length === 0) {
          warningsDiv.innerHTML = '<span class="no-warning">現時沒有生效的天氣警告。</span>';
        } else {
          warningsDiv.innerHTML = '';
          for (let key in warningsData) {
            warningsDiv.innerHTML += `<div class="warning-badge">⚠️ ${warningsData[key].name}</div><br>`;
          }
        }

        const forecastRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
        const forecastData = await forecastRes.json();
        document.getElementById('forecast-display').innerHTML = `
          <strong>${forecastData.forecastPeriod}：</strong>
          <div>${forecastData.forecastDesc}</div>
          <strong>展望 Outlook：</strong>
          <div>${forecastData.outlook}</div>
        `;

        fetchRealWindData();

      } catch (error) {
        console.error("Error fetching HKO data:", error);
      }
    }
    
    function getBeaufortScale(kmh) {
      if (kmh < 1) return "0 級 (無風 Calm)";
      if (kmh <= 5) return "1 級 (輕微 Light air)";
      if (kmh <= 11) return "2 級 (輕微 Light breeze)";
      if (kmh <= 19) return "3 級 (和緩 Gentle breeze)";
      if (kmh <= 28) return "4 級 (和緩 Moderate breeze)";
      if (kmh <= 38) return "5 級 (清勁 Fresh breeze)";
      if (kmh <= 49) return "6 級 (強風 Strong breeze)";
      if (kmh <= 61) return "7 級 (強風 Near gale)";
      if (kmh <= 74) return "8 級 (烈風 Gale)";
      if (kmh <= 88) return "9 級 (烈風 Strong gale)";
      if (kmh <= 102) return "10 級 (暴風 Storm)";
      if (kmh <= 117) return "11 級 (暴風 Violent storm)";
      return "12 級 (颶風 Hurricane)";
    }

    // Helper function to translate English wind directions to Chinese
    function translateDirection(dir) {
      const dirMap = {
        "N": "北 N", "NE": "東北 NE", "E": "東 E", "SE": "東南 SE",
        "S": "南 S", "SW": "西南 SW", "W": "西 W", "NW": "西北 NW"
      };
      return dirMap[dir.trim().toUpperCase()] || dir;
    }

    async function fetchRealWindData() {
      try {
        // FIXED: Using the English CSV file to prevent Chinese character encoding bugs
        const windRes = await fetch('https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind.csv');
        
        if (!windRes.ok) throw new Error("Network response was not ok");
        
        let windText = await windRes.text();
        windText = windText.replace(/"/g, ''); // Clean up quotes
        
        const rows = windText.split('\n');
        
        // Search for the English name to guarantee a match
        const skRow = rows.find(row => row.includes('Sai Kung'));

        if (skRow) {
          const cols = skRow.split(',');
          
          // Apply Translation to the Direction (Column 2)
          const rawDir = cols[2] ? cols[2].trim() : "微風";
          const windDir = translateDirection(rawDir);
          
          const speedKmh = parseFloat(cols[3]) || 0;
          const gustKmh = parseFloat(cols[4]) || 0;
          
          const speedMs = (speedKmh / 3.6).toFixed(1);
          const beaufortText = getBeaufortScale(speedKmh);

          document.getElementById('wind-speed').innerHTML = `${speedKmh} <span>km/h</span>`;
          document.getElementById('wind-direction').innerText = windDir;
          document.getElementById('wind-gust').innerText = `${gustKmh} km/h`;
          document.getElementById('wind-speed-ms').innerText = `${speedMs} m/s`;
          document.getElementById('wind-beaufort').innerText = beaufortText;
        } else {
          document.getElementById('wind-direction').innerText = "暫無數據";
        }
      } catch (error) {
        console.error("Failed to parse real wind data:", error);
        document.getElementById('wind-speed').innerHTML = `-- <span>km/h</span>`;
        // Helpful error message if CORS blocks the fetch
        document.getElementById('wind-direction').innerText = "被瀏覽器阻擋 (需上傳至伺服器)";
      }
    }

    function renderTideChart() {
      const ctx = document.getElementById('tideChart').getContext('2d');
      const labels = [];
      const data = [];
      for(let i = 0; i <= 24; i++) {
        labels.push(`${i}:00`);
        const height = 1.5 + Math.sin((i / 24) * Math.PI * 4) * 1.2; 
        data.push(height.toFixed(2));
      }

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '天文潮汐預測 (m)',
            data: data,
            borderColor: '#0071e3',
            backgroundColor: 'rgba(0, 113, 227, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 0,
            pointHitRadius: 20
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, callbacks: { label: function(context) { return context.parsed.y + ' m'; } } } },
          scales: { y: { min: 0, max: 3, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { ticks: { maxTicksLimit: 8 }, grid: { display: false } } },
          interaction: { mode: 'nearest', axis: 'x', intersect: false }
        }
      });
    }

    fetchWeatherData();
    renderTideChart();
  </script>
